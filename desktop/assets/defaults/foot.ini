[main]
include=~/.local/state/tamlinux/current/theme/foot.ini
term=xterm-256color
font=AtkynsonMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0
selection-target=both

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[mouse-bindings]
selection-override-modifiers=Shift
select-extend=none
primary-paste=none
clipboard-paste=BTN_RIGHT

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
