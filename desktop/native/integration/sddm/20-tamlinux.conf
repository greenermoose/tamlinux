# Generic vendor defaults. Account/autologin policy belongs in /etc.
# /etc/sddm.conf.d and /etc/sddm.conf take precedence over this file.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=/usr/bin/start-hyprland -- --config /usr/share/sddm/tamlinux-hyprland.lua

[Theme]
ThemeDir=/usr/share/sddm/themes
Current=tamlinux

[Users]
RememberLastUser=true
RememberLastSession=true
