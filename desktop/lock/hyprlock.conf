# Tamlinux lock screen; MIT, see LICENSE. Host owns PAM authentication.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(17, 28, 24, 1.0)
}

label {
    monitor =
    text = $TIME
    color = rgba(214, 213, 188, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(129, 184, 168, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    rounding = 8
    outer_color = rgba(80, 148, 117, 1.0)
    inner_color = rgba(12, 21, 18, 1.0)
    font_color = rgba(193, 196, 151, 1.0)
    check_color = rgba(45, 213, 183, 1.0)
    fail_color = rgba(255, 83, 69, 1.0)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}
